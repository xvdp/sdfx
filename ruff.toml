# Same style as ext/points-as-tori (pyproject [tool.ruff]).
line-length = 120
indent-width = 4
exclude = ["ext", "build"]

[format]
indent-style = "tab"
quote-style = "single"
docstring-code-format = false

[lint]
select = ["E4", "E7", "E9", "F"]  # ruff defaults when the original config was written
ignore = ["F403", "F405", "E402", "F841"]
