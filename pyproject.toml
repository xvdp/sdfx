[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdfx"
version = "0.1.0"
description = "Signed distance fields from point clouds: torch port of Points as Tori (inference, training, data generation) and an SDF viewer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "torch>=2.1",  # tested: 2.1.2 (CUDA 12.1 wheel, Python 3.11) and 2.14.1 (Python 3.13)
  "numpy",       # tested: 1.26.4 and 2.5.4
  "plyfile",     # point-cloud / mesh I/O
]

[project.optional-dependencies]
train = ["matplotlib"]  # training-history plot (skipped when missing)
test = ["pytest"]
# training-data generation (points_as_tori.training.mesh_data): mesh downloads/archives and mesh simplification
dataset = ["thingi10k", "py7zr", "numpy-stl", "pyfqmr"]
# viewer (sdfview): OpenGL 3.3 via moderngl; window via moderngl-window (pyglet backend by default, glfw optional)
view = ["moderngl>=5.8", "moderngl-window>=3.0", "pyglet>=2.0"]
# parity references for the tests: the original JAX code and the original C++ (built from tests/points_as_tori/reference)
reference = ["jax==0.8.2", "flax==0.12.2", "optax", "nanobind", "matplotlib"]

[tool.setuptools.packages.find]
include = ["points_as_tori*", "sdfview*"]

[tool.setuptools.package-data]
points_as_tori = ["models/*.pt", "PORT_NOTES.md"]
sdfview = ["shaders/glsl/*", "web/*.js", "NOTES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
